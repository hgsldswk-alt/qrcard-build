name: QRCard
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it]
settings:
  base:
    APP_ID: com.hgsldswk.qrcard
    APP_STORE_ID: "6836773977"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  QRCard:
    type: application
    platform: iOS
    sources: [QRCard, Shared]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: QRCard AppStore
    info:
      path: QRCard/Info.plist
      properties:
        CFBundleDisplayName: 二维码制卡
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: QR Card Layout
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.qrcard.layout]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.qrcard.layout
            UTTypeConformsTo: [public.data, public.content]
            UTTypeDescription: QR Card Layout
            UTTypeTagSpecification:
              public.filename-extension: [qrcard]
  QRCardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QRCardTests, Shared]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  QRCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QRCardUITests]
    dependencies:
      - target: QRCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QRCard
schemes:
  QRCard:
    build:
      targets:
        QRCard: all
        QRCardTests: [test]
    test:
      config: Debug
      targets: [QRCardTests]
  QRCardUI:
    build:
      targets:
        QRCard: all
        QRCardUITests: [test]
    test:
      config: Debug
      targets: [QRCardUITests]
